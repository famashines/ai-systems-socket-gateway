<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>socket-gateway harness</title>
    <style>
      body {
        font:
          14px/1.4 system-ui,
          sans-serif;
        margin: 24px;
        color: #1c1917;
      }
      h1 {
        font-size: 18px;
      }
      #status {
        font-weight: 600;
      }
      #log {
        font:
          12px/1.5 ui-monospace,
          monospace;
        padding-left: 24px;
      }
      #log li.out {
        color: #57534e;
      }
      #chat li {
        margin: 4px 0;
      }
      #chat li.final {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>socket-gateway WebSocket harness (dev only)</h1>
    <p>Status: <span id="status">idle</span></p>
    <h2>Chat</h2>
    <ul id="chat"></ul>
    <h2>Frames</h2>
    <ol id="log"></ol>
    <script>
      const status = document.getElementById("status");
      const log = document.getElementById("log");
      const chatList = document.getElementById("chat");
      const chat = { messages: new Map(), tasks: new Map(), watched: new Set() };
      const taskOf = (taskId) => {
        if (!chat.tasks.has(taskId)) chat.tasks.set(taskId, { attempt: 0, parts: [], final: null });
        return chat.tasks.get(taskId);
      };
      const render = () => {
        chatList.replaceChildren();
        const ordered = [...chat.messages.values()].sort((a, b) =>
          a.createdAt === b.createdAt ? 0 : a.createdAt < b.createdAt ? -1 : 1,
        );
        for (const message of ordered) {
          const item = document.createElement("li");
          item.textContent = `${message.role}: ${message.text}`;
          item.className = message.role;
          chatList.append(item);
        }
        for (const [taskId, task] of chat.tasks) {
          const item = document.createElement("li");
          item.dataset.taskId = taskId;
          item.className = task.final === null ? "live" : "final";
          item.textContent =
            task.final === null
              ? `agent (attempt ${task.attempt}, live): ${task.parts.join("")}`
              : `agent (final): ${task.final}`;
          chatList.append(item);
        }
      };
      const onFrame = (frame) => {
        if (frame.type === "notice" && frame.topic.startsWith("conversation:")) {
          const message = frame.data;
          const known = chat.messages.get(message.messageId);
          if (known && known.rev >= frame.rev) return;
          if (message.role === "owner") {
            chat.messages.set(message.messageId, message);
            if (message.taskId && !chat.watched.has(message.taskId)) {
              chat.watched.add(message.taskId);
              window.harness.send({ type: "subscribe", topics: [`task:${message.taskId}`] });
            }
          } else {
            taskOf(message.taskId).final = message.text;
          }
          render();
        }
        if (frame.type === "delta") {
          const task = taskOf(frame.taskId);
          if (task.final !== null || frame.attempt < task.attempt) return;
          if (frame.attempt > task.attempt) {
            task.attempt = frame.attempt;
            task.parts = [];
          }
          task.parts[frame.i] = frame.text;
          render();
        }
      };
      const line = (text, kind) => {
        const item = document.createElement("li");
        item.textContent = text;
        item.className = kind;
        log.append(item);
      };
      window.harness = {
        frames: [],
        closed: null,
        socket: null,
        connect(url) {
          this.frames = [];
          this.closed = null;
          return new Promise((resolve) => {
            const socket = new WebSocket(url);
            this.socket = socket;
            status.textContent = "connecting";
            socket.onopen = () => {
              status.textContent = "open";
              resolve(true);
            };
            socket.onmessage = (event) => {
              const frame = JSON.parse(event.data);
              this.frames.push(frame);
              line(`in  ${event.data}`, "in");
              onFrame(frame);
            };
            socket.onclose = (event) => {
              this.closed = { code: event.code, reason: event.reason };
              status.textContent = `closed ${event.code} ${event.reason}`;
              line(`close ${event.code} ${event.reason}`, "in");
              resolve(false);
            };
          });
        },
        send(message) {
          const text = JSON.stringify(message);
          line(`out ${text.replace(/"token":"[^"]*"/, '"token":"<redacted>"')}`, "out");
          this.socket.send(text);
        },
        close() {
          this.socket.close(1000);
        },
      };
    </script>
  </body>
</html>
